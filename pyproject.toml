[project]
name = "track-id"
version = "0.4.0"
description = "CLI for downloading, searching, and enriching MP3 metadata via Soulseek, Bandcamp, MusicBrainz, and Discogs"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "track-id contributors" },
]
keywords = ["mp3", "id3", "metadata", "music", "cli", "download", "soulseek", "bandcamp", "musicbrainz", "discogs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.32.4",
    "typer>=0.16.0",
    # urllib3 v2 requires OpenSSL 1.1.1+ and fails to import on macOS system
    # Python 3.9, which links LibreSSL. Revisit when dropping 3.9 support.
    "urllib3<2.0.0",
    "mutagen>=1.47.0",
    "rich>=13.0.0",
    "aioslsk>=1.5.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/vtasca/track-id"
Repository = "https://github.com/vtasca/track-id"
Issues = "https://github.com/vtasca/track-id/issues"

[project.scripts]
track-id = "track_id.track_id:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["track_id"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.17.1",
    "ruff>=0.5.0",
    "types-requests>=2.31.0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# Defaults (pyflakes + core pycodestyle errors) plus import sorting and bugbear.
# E501 (line length) is left off to avoid churn in Typer option declarations.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer's idiom is calls in argument defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.9"

[[tool.mypy.overrides]]
# aioslsk ships no type stubs; tomllib only exists on Python 3.11+ and the
# tomli backport only below 3.11 — both are imported behind try/except
# ImportError in config.py, so one of the two is always missing.
module = ["aioslsk.*", "tomllib", "tomli"]
ignore_missing_imports = true
